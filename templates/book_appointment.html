{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="bi bi-calendar-plus me-2"></i>Book Appointment</h3>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('book_appointment') }}">
            <div class="row mb-4">
                <div class="col-md-6">
                    <label for="department" class="form-label">Select Department</label>
                    <select class="form-select" id="department" name="department" required>
                        <option value="" selected disabled>Select Department</option>
                        {% for department in departments %}
                            <option value="{{ department.id }}">{{ department.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="doctor" class="form-label">Select Doctor</label>
                    <select class="form-select" id="doctor" name="doctor_id" required disabled>
                        <option value="" selected disabled>Select Doctor</option>
                    </select>
                </div>
            </div>
            
            <div class="row mb-4">
                <div class="col-md-6">
                    <label for="appointment_date" class="form-label">Appointment Date</label>
                    <input type="date" class="form-control" id="appointment_date" name="appointment_date" required min="{{ today }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Available Time Slots</label>
                    <div id="time_slots" class="time-slots-container">
                        <p class="text-muted">Select a doctor and date to see available time slots</p>
                    </div>
                </div>
            </div>
            
            <div class="row mb-4">
                <div class="col-md-6">
                    <label for="appointment_type" class="form-label">Appointment Type</label>
                    <select class="form-select" id="appointment_type" name="appointment_type" required>
                        <option value="" selected disabled>Select Type</option>
                        <option value="Consultation">Consultation</option>
                        <option value="Follow-up">Follow-up</option>
                        <option value="Check-up">Check-up</option>
                        <option value="Surgery">Surgery</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="notes" class="form-label">Notes (Optional)</label>
                    <textarea class="form-control" id="notes" name="notes" rows="1" placeholder="Any special requirements or notes..."></textarea>
                </div>
            </div>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle me-2"></i>Book Appointment
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const departmentSelect = document.getElementById('department');
        const doctorSelect = document.getElementById('doctor');
        const dateInput = document.getElementById('appointment_date');
        const timeSlotsContainer = document.getElementById('time_slots');
        let selectedTimeSlot = null;
        
        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);
        
        // Fetch doctors when department is selected
        departmentSelect.addEventListener('change', function() {
            const departmentId = this.value;
            doctorSelect.innerHTML = '<option value="" selected disabled>Select Doctor</option>';
            doctorSelect.disabled = true;
            
            if (departmentId) {
                fetch(`/get_doctors/${departmentId}`)
                    .then(response => response.json())
                    .then(doctors => {
                        doctors.forEach(doctor => {
                            const option = document.createElement('option');
                            option.value = doctor.id;
                            option.textContent = `${doctor.name} (${doctor.specialization})`;
                            doctorSelect.appendChild(option);
                        });
                        doctorSelect.disabled = false;
                    });
            }
        });
        
        // Fetch time slots when doctor and date are selected
        function fetchTimeSlots() {
            const doctorId = doctorSelect.value;
            const date = dateInput.value;
            
            if (doctorId && date) {
                fetch(`/get_time_slots/${doctorId}/${date}`)
                    .then(response => response.json())
                    .then(timeSlots => {
                        timeSlotsContainer.innerHTML = '';
                        
                        if (timeSlots.length > 0) {
                            timeSlots.forEach(slot => {
                                const slotElement = document.createElement('div');
                                slotElement.className = 'time-slot';
                                slotElement.textContent = slot;
                                slotElement.addEventListener('click', function() {
                                    document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
                                    this.classList.add('selected');
                                    selectedTimeSlot = slot;
                                    
                                    // Create hidden input for selected time
                                    let timeInput = document.getElementById('appointment_time');
                                    if (!timeInput) {
                                        timeInput = document.createElement('input');
                                        timeInput.type = 'hidden';
                                        timeInput.id = 'appointment_time';
                                        timeInput.name = 'appointment_time';
                                        timeSlotsContainer.appendChild(timeInput);
                                    }
                                    timeInput.value = slot;
                                });
                                timeSlotsContainer.appendChild(slotElement);
                            });
                        } else {
                            timeSlotsContainer.innerHTML = '<p class="text-muted">No available time slots for the selected date</p>';
                        }
                    });
            } else {
                timeSlotsContainer.innerHTML = '<p class="text-muted">Select a doctor and date to see available time slots</p>';
            }
        }
        
        doctorSelect.addEventListener('change', fetchTimeSlots);
        dateInput.addEventListener('change', fetchTimeSlots);
    });
</script>
{% endblock %}
